# Verify the docs site builds, and that the committed docs/ output is current.
#
# Pages is served in legacy mode from main:/docs, so the build output is
# committed. This job fails if someone edits web/ without rebuilding, which
# would otherwise silently ship a stale site.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check docs/ is up to date
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is stale. Run ./scripts/build_docs.sh and commit the result."
            git diff --stat -- docs
            exit 1
          fi
          echo "docs/ matches the current sources."
