<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NSplusthon — کلاینت پایتون سروش پلاس</title>
    <meta name="description" content="کتابخانه async پایتون برای سروش پلاس. حساب کاربری و ربات، بدون نیاز به API ID." />
    <link rel="icon" href="/NSplusthon/favicon.ico" />
    <meta property="og:title" content="NSplusthon" />
    <meta property="og:description" content="Async Python client for Soroush Plus. Users and bots. No API id or hash." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amogrotex.github.io/NSplusthon/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // set the theme before first paint so there is no light flash
      (function () {
        try {
          var s = localStorage.getItem("nsplusthon-theme");
          var d = s ? s : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
