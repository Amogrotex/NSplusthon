site_name: NSplusthon
site_description: Async Python client for Soroush Plus
site_url: https://amogrotex.github.io/NSplusthon/
repo_url: https://github.com/Amogrotex/NSplusthon
repo_name: Amogrotex/NSplusthon
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: fa
  direction: rtl
  logo: logo.png
  favicon: favicon.ico
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: مطابق سیستم
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: حالت تاریک
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-sunny
        name: حالت روشن
  font:
    text: Vazirmatn
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Amogrotex/NSplusthon
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nsplusthon/
  generator: false
  alternate:
    - name: فارسی
      link: /
      lang: fa
    - name: English
      link: /en/
      lang: en

nav:
  - خانه: index.md
  - English: en/index.md
  - شروع سریع: quick-start.md
  - نصب: installation.md
  - مقایسه: compare.md
  - مفاهیم:
      - concepts/index.md
      - Entity: concepts/entities.md
      - Session: concepts/sessions.md
      - رویدادها: concepts/events.md
      - String Sessions: concepts/string-sessions.md
      - خطاها: concepts/errors.md
      - API کامل: concepts/full-api.md
      - Bot API و MTProto: concepts/botapi-vs-mtproto.md
      - asyncio: concepts/asyncio.md
      - Command Router: concepts/router.md
  - مثال‌ها:
      - examples/index.md
      - کاربران: examples/users.md
      - چت‌ها و کانال‌ها: examples/chats-and-channels.md
      - پیام‌ها: examples/working-with-messages.md
      - هشدار: examples/word-of-warning.md
  - مرجع API: api-reference.md
  - سوالات متداول: faq.md

extra_css:
  - stylesheets/extra.css
